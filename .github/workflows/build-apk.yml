name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ১. প্রজেক্ট প্যাকেজ ও ওয়েব বিল্ড
      - name: Install Dependencies and Build Web App
        run: |
          npm install
          npm run build || node build.js

      # ২. ক্যাপাসিটর অ্যান্ড্রয়েড ইঞ্জিন সেটআপ
      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Flashgram" "com.sohel.flashgram" --web-dir "dist"
          npx cap add android

      # ৩. ফুলস্ক্রিন ও সব পারমিশন যুক্ত করা
      - name: Configure Fullscreen & Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # প্রয়োজনীয় সব পারমিশন
          PERMISSIONS="
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
              <uses-feature android:name=\"android.hardware.microphone\" android:required=\"false\" />"

          sed -i "/<manifest/a $PERMISSIONS" $MANIFEST

          # ফুলস্ক্রিন মোড কনফিগারেশন
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ]; then
            sed -i '/<resources>/a <style name=\"AppTheme.NoActionBarFullScreen\" parent=\"Theme.AppCompat.Light.NoActionBar\"><item name=\"android:windowFullscreen\">true</item><item name=\"android:windowNoTitle\">true</item><item name=\"android:windowActionBar\">false</item><item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item></style>' $STYLES
          fi

          npx cap sync android

      # ৪. APK বিল্ড করা
      - name: Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # ৫. তৈরি হওয়া APK ফাইলটি ডাউনলোডের জন্য আপলোড
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Flashgram-FullScreen-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
