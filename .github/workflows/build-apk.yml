name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Java 21 সেটআপ (invalid source release: 21 পুরোপুরি বন্ধ করতে)
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ডিপেন্ডেন্সি ইনস্টল ও ওয়েব অ্যাপ বিল্ড
      - name: Install Dependencies and Build Web Project
        run: |
          npm install
          npm run build || node build.js

      # ক্যাপাসিটর অ্যান্ড্রয়েড সেটআপ
      - name: Setup Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Flashgram" "com.sohel.flashgram" --web-dir "dist"
          npx cap add android

      # ডুপ্লিকেট ছাড়া পারমিশন যুক্ত করা
      - name: Configure Android Permissions
        run: |
          node -e '
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          if (fs.existsSync(manifestPath)) {
            let manifest = fs.readFileSync(manifestPath, "utf8");
            const permissions = [
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_MEDIA_VIDEO",
              "android.permission.READ_MEDIA_AUDIO"
            ];
            let permissionTags = "";
            permissions.forEach(perm => {
              if (!manifest.includes(perm)) {
                permissionTags += `\n    <uses-permission android:name="${perm}" />`;
              }
            });
            permissionTags += `\n    <uses-feature android:name="android.hardware.camera" android:required="false" />`;
            permissionTags += `\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />`;
            manifest = manifest.replace("<application", permissionTags + "\n    <application");
            fs.writeFileSync(manifestPath, manifest);
          }
          '
          npx cap sync android

      # জাভা ২১ এবং গ্রেডেল পাথ পুরোপুরি কনফিগার করে APK বিল্ড
      - name: Build Android APK File
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # তৈরি হওয়া APK ফাইল আপলোড
      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flashgram-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
