name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ক্যাপাসিটর অ্যান্ড্রয়েডের জন্য প্রয়োজনীয় Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # অ্যাপ প্যাকেজ ইনস্টল ও বিল্ড
      - name: Install Dependencies and Build Web App
        run: |
          npm install
          npm run build || node build.js

      # ক্যাপাসিটর অ্যান্ড্রয়েড কনফিগারেশন
      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Flashgram" "com.sohel.flashgram" --web-dir "dist"
          npx cap add android

      # ডুপ্লিকেট ছাড়া পারমিশন যুক্ত করা
      - name: Add Android Permissions
        run: |
          node -e '
          const fs = require("fs");
          const p = "android/app/src/main/AndroidManifest.xml";
          if (fs.existsSync(p)) {
            let m = fs.readFileSync(p, "utf8");
            const perms = [
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_MEDIA_VIDEO",
              "android.permission.READ_MEDIA_AUDIO"
            ];
            let toAdd = "";
            perms.forEach(perm => {
              if (!m.includes(perm)) {
                toAdd += `\n    <uses-permission android:name="${perm}" />`;
              }
            });
            toAdd += `\n    <uses-feature android:name="android.hardware.camera" android:required="false" />`;
            toAdd += `\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />`;
            
            m = m.replace("<application", toAdd + "\n    <application");
            fs.writeFileSync(p, m);
          }
          '
          npx cap sync android

      # APK ফাইল জেনারেট
      - name: Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # তৈরি হওয়া APK আপলোড
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Flashgram-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
